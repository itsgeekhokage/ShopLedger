<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture diagram of ShopLedger modules and the numbered browser-to-storage order flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:13px}
      .title{font-size:24px;font-weight:700}.subtitle{font-size:13px;fill:#475569}
      .head{font-size:15px;font-weight:700}.small{font-size:12px;fill:#475569}
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.4}.group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
      .focus{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.flow{fill:none;stroke:#2563eb;stroke-width:2.2;marker-end:url(#flowArrow)}
      .link{fill:none;stroke:#64748b;stroke-width:1.4;marker-end:url(#arrow)}
      .badge{fill:#dbeafe;stroke:#93c5fd;stroke-width:1}.badgeText{font-size:12px;font-weight:700;fill:#1d4ed8}
      .legendText{font-size:12px}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f1f5f9"/>
  <text x="32" y="38" class="title">ShopLedger | Application architecture</text>
  <text x="32" y="61" class="subtitle">Verified source modules and request path for placing an order</text>

  <!-- Main runtime layers -->
  <rect x="28" y="82" width="1144" height="104" rx="12" class="group"/>
  <rect x="46" y="105" width="230" height="60" rx="8" class="box"/>
  <text x="62" y="128" class="head">Browser UI · public/</text>
  <text x="62" y="149" class="small">index.html · js/app.js · css/style.css</text>
  <rect x="380" y="105" width="250" height="60" rx="8" class="box"/>
  <text x="398" y="128" class="head">server.js · Express app</text>
  <text x="398" y="149" class="small">JSON body · static UI · mounts /api routers</text>
  <rect x="744" y="105" width="190" height="60" rx="8" class="box"/>
  <text x="762" y="128" class="head">config.js</text>
  <text x="762" y="149" class="small">shop · GST slabs · coupons · port</text>
  <rect x="980" y="105" width="170" height="60" rx="8" class="box"/>
  <text x="997" y="128" class="head">data/db.json</text>
  <text x="997" y="149" class="small">JSON persistent store</text>
  <path d="M276 135 H380" class="flow"/><circle cx="328" cy="122" r="12" class="badge"/><text x="324" y="126" class="badgeText">1</text>
  <path d="M630 135 H744" class="link"/>

  <!-- Routers -->
  <rect x="28" y="205" width="1144" height="158" rx="12" class="group"/>
  <text x="46" y="230" class="head">routes/ · mounted under /api by server.js</text>
  <rect x="48" y="246" width="250" height="94" rx="8" class="box"/>
  <text x="64" y="269" class="head">orders.js</text>
  <text x="64" y="290" class="small">POST /orders · GET /orders</text>
  <text x="64" y="309" class="small">GET /orders/:id · POST cancel</text>
  <rect x="324" y="246" width="250" height="94" rx="8" class="box"/>
  <text x="340" y="269" class="head">products.js</text>
  <text x="340" y="290" class="small">GET /products · GET /coupons</text>
  <text x="340" y="309" class="small">inventory + tax display helpers</text>
  <rect x="600" y="246" width="250" height="94" rx="8" class="box"/>
  <text x="616" y="269" class="head">customers.js</text>
  <text x="616" y="290" class="small">GET /customers</text>
  <text x="616" y="309" class="small">POST customer settlement</text>
  <rect x="876" y="246" width="260" height="94" rx="8" class="box"/>
  <text x="892" y="269" class="head">reports.js</text>
  <text x="892" y="290" class="small">dashboard · GST reconciliation</text>
  <text x="892" y="309" class="small">pricing preview · admin export</text>
  <path d="M505 165 V246" class="flow"/><circle cx="505" cy="205" r="12" class="badge"/><text x="501" y="209" class="badgeText">2</text>

  <!-- Library modules -->
  <rect x="28" y="382" width="1144" height="294" rx="12" class="group"/>
  <text x="46" y="407" class="head">lib/ · application logic</text>
  <rect x="48" y="426" width="250" height="96" rx="8" class="box"/>
  <text x="64" y="449" class="head">orders.js</text>
  <text x="64" y="470" class="small">add · get · cancel · list</text>
  <text x="64" y="490" class="small">order records and lifecycle</text>
  <rect x="324" y="426" width="250" height="96" rx="8" class="box"/>
  <text x="340" y="449" class="head">pricing.js</text>
  <text x="340" y="470" class="small">subtotal · discount · computeTotals</text>
  <text x="340" y="490" class="small">line discount then line GST</text>
  <rect x="600" y="426" width="250" height="96" rx="8" class="box"/>
  <text x="616" y="449" class="head">inventory.js</text>
  <text x="616" y="470" class="small">find · check · reserve · release</text>
  <text x="616" y="490" class="small">sellable stock and summary</text>
  <rect x="876" y="426" width="260" height="96" rx="8" class="box"/>
  <text x="892" y="449" class="head">ledger.js</text>
  <text x="892" y="470" class="small">customer lookup · Khata charge</text>
  <text x="892" y="490" class="small">settlements · reverse debit</text>

  <rect x="48" y="542" width="250" height="96" rx="8" class="box"/>
  <text x="64" y="565" class="head">coupons.js</text>
  <text x="64" y="586" class="small">normalizeCode · validate</text>
  <text x="64" y="606" class="small">calculateDiscount · listActive</text>
  <rect x="324" y="542" width="250" height="96" rx="8" class="box"/>
  <text x="340" y="565" class="head">tax.js</text>
  <text x="340" y="586" class="small">getRateForItem · getSlabPercent</text>
  <text x="340" y="606" class="small">splitCgstSgst</text>
  <rect x="600" y="542" width="250" height="96" rx="8" class="focus"/>
  <text x="616" y="565" class="head">invoice.js</text>
  <text x="616" y="586" class="small">computeInvoiceFigures · render</text>
  <text x="616" y="606" class="small">printable HTML invoice</text>
  <rect x="876" y="542" width="260" height="96" rx="8" class="box"/>
  <text x="892" y="565" class="head">store.js</text>
  <text x="892" y="586" class="small">read · write · appendAudit</text>
  <text x="892" y="606" class="small">reads/writes data/db.json</text>

  <!-- Supporting lib modules -->
  <rect x="48" y="646" width="250" height="0" rx="8" fill="none" stroke="none"/>
  <text x="48" y="661" class="small">Also in lib/: dates.js (today, normalizeDateKey, getFiscalYear) · reports.js (getDashboardSummary, getGstReconciliation)</text>

  <!-- Numbered order flow markers on verified code locations -->
  <circle cx="280" cy="258" r="12" class="badge"/><text x="276" y="262" class="badgeText">3</text>
  <circle cx="557" cy="438" r="12" class="badge"/><text x="553" y="442" class="badgeText">4</text>
  <circle cx="1108" cy="438" r="12" class="badge"/><text x="1104" y="442" class="badgeText">5</text>
  <circle cx="280" cy="438" r="12" class="badge"/><text x="276" y="442" class="badgeText">6</text>
  <circle cx="1110" cy="556" r="12" class="badge"/><text x="1106" y="560" class="badgeText">7</text>

  <!-- Legend -->
  <rect x="30" y="714" width="1140" height="64" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="48" y="739" class="head">Order flow</text>
  <text x="150" y="739" class="legendText">1 Select cart in UI</text>
  <text x="292" y="739" class="legendText">2 POST /api/orders</text>
  <text x="440" y="739" class="legendText">3 Validate / resolve items</text>
  <text x="635" y="739" class="legendText">4 Check stock + compute GST totals</text>
  <text x="880" y="739" class="legendText">5 Apply Khata if selected</text>
  <text x="150" y="762" class="legendText">6 Reserve stock; add order + audit</text>
  <text x="440" y="762" class="legendText">7 Write db.json; return order</text>
  <rect x="800" y="750" width="18" height="18" rx="3" class="focus"/><text x="828" y="764" class="legendText">Ticket focus: invoice.js</text>
  <line x1="1010" y1="759" x2="1050" y2="759" class="flow"/><text x="1060" y="764" class="legendText">order flow</text>
</svg>

